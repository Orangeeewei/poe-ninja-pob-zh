name: Backfill releases

# 回填歷史版本的 GitHub Release(一次性/可重跑;已存在的 Release 會略過)。
# 每個版本以「版本=commit」指定:用該 commit 的原始碼重新打包(用現行的打包腳本),說明取自現行 README 更新紀錄。
# tag 請先在本機建好推上去(git tag -a vX.Y.Z <commit> && git push origin vX.Y.Z);回填的 Release 不會搶走「Latest」。
on:
  workflow_dispatch:
    inputs:
      versions:
        description: '版本=commit 清單(空白分隔)'
        required: true
        default: '2.0.0=c4342d7 2.0.1=11e1c43 2.1.1=cf63c3e 2.2.0=34158d8 2.3.0=13a0758'
  push:
    branches: [main]
    paths:
      - .github/workflows/backfill-releases.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 回填
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ inputs.versions || '2.0.0=c4342d7 2.0.1=11e1c43 2.1.1=cf63c3e 2.2.0=34158d8 2.3.0=13a0758' }}
        run: |
          set -ex
          exec > >(tee -a backfill.log) 2>&1
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p out
          for pair in $VERSIONS; do
            VER="${pair%%=*}"; SHA="${pair#*=}"
            echo "=== v$VER @ $SHA"
            # tag 由本機推(GITHUB_TOKEN 對「工作流程檔與 main 不同的舊 commit」建 tag 會被 workflows 權限擋下);
            # 沒有 tag 時改由 Release API 以 --target 建立
            TARGET=""
            if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
              echo "tag v$VER 已存在"
            else
              TARGET="--target $(git rev-parse "$SHA")"
            fi
            if gh release view "v$VER" >/dev/null 2>&1; then
              echo "Release v$VER 已存在,略過"; continue
            fi
            rm -rf "src-$VER"
            git worktree add -f "src-$VER" "$SHA" >/dev/null
            node tools/pack-extension.mjs --root "src-$VER" --out out
            node tools/release-notes.mjs "$VER" > "notes-$VER.md"
            gh release create "v$VER" "out/poe-ninja-pob-zh-$VER.zip" \
              --title "poe.ninja PoE2 中文化 v$VER" \
              --notes-file "notes-$VER.md" \
              --latest=false $TARGET
            git worktree remove --force "src-$VER"
          done

      # 公開 repo 不登入看不到 log,但 job summary 看得到 → 把完整輸出貼進去方便除錯
      - name: 輸出到 summary
        if: always()
        run: |
          { echo '```'; cat backfill.log 2>/dev/null | tail -200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
